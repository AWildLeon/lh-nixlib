name: Promote release

# Advance the `release` branch to a commit only after its public packages are
# built and pushed to Cachix. Downstream machines can then track `release`
# and be guaranteed every derivation is already in the public cache instead
# of racing an in-flight build on `main`.
#
# Triggers on completion of the public "Build and push to Cachix" workflow
# (build.yml). The private attic build and the pages deploy are intentionally
# not gated on — only the public Cachix build decides a commit is releasable.

on:
  workflow_run:
    workflows: ["Build and push to Cachix"]
    types: [completed]

permissions:
  contents: write

concurrency:
  # Serialize promotions so a slower older run can't clobber `release` with an
  # older commit after a newer one already advanced it.
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    # Only promote a green build of main. workflow_run also fires for PR and
    # dispatch runs; head_branch == main filters those out.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Push release to built commit if newer
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release || true

          if git rev-parse --verify --quiet refs/remotes/origin/release >/dev/null; then
            current="$(git rev-parse refs/remotes/origin/release)"

            if [ "$current" = "$BUILT_SHA" ]; then
              echo "release already at $BUILT_SHA, nothing to do."
              exit 0
            fi

            # Compare committer dates instead of ancestry so that a rewritten
            # history (rebase/amend) can still advance release. Only push when
            # the built commit is strictly newer than the current release tip,
            # preventing an older/slower build from clobbering a newer release.
            current_ts="$(git show -s --format=%ct "$current")"
            built_ts="$(git show -s --format=%ct "$BUILT_SHA")"

            if [ "$built_ts" -le "$current_ts" ]; then
              echo "built commit $BUILT_SHA ($built_ts) not newer than release $current ($current_ts), skipping."
              exit 0
            fi
          fi

          git push --force origin "$BUILT_SHA:refs/heads/release"
