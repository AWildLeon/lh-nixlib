name: Build and push to my private attic server
# This is used to build non redistributable packages for myself.
# The Attic Cache used is private

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - ci/cache-bundle.nix
      - .github/workflows/private_build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          # No ARM Systems Currently.
          #- runner: ubuntu-24.04-arm
          #  system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0.5.0
        with:
          endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-push: true

      - name: Build private cache bundle for ${{ matrix.system }}
        run: |
          # ci/cache-bundle.nix is a single derivation depending on every
          # package we want cached, from both the stable and unstable nixpkgs
          # inputs pinned in flake.lock. The package list lives in that file.
          #
          # --keep-going realizes every buildable dependency even if some
          # fail, so a package that fails to build is simply skipped rather
          # than aborting the whole run. The bundle itself may fail in that
          # case; that is fine, we only care about the realized packages.
          echo "::group::Building bundle"
          nix build --impure --keep-going --print-build-logs \
            -f ci/cache-bundle.nix bundle || true
          echo "::endgroup::"

          # Collect the outputs that actually built, for pushing.
          : > paths.txt
          while read -r p; do
            [ -z "$p" ] && continue
            if nix path-info "$p" >/dev/null 2>&1; then
              echo "$p" >> paths.txt
            else
              echo "::warning::Skipping $p (not built)"
            fi
          done < <(nix eval --impure --raw -f ci/cache-bundle.nix outPathsText)

      - name: Push built packages to Attic
        if: github.event_name != 'pull_request'
        run: |
          # Pushes the listed outputs and their runtime closure.
          # Build-time-only deps (e.g. go-modules) are not runtime
          # references and stay out of the cache.
          while read -r path; do
            [ -z "$path" ] && continue
            attic push ${{ secrets.ATTIC_CACHE }} "$path"
          done < paths.txt
