name: Build and push to my private attic server
# This is used to build non redistributable packages for myself.
# The Attic Cache used is private

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - ci/cache-bundle.nix
      - .github/workflows/private_build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          # No ARM Systems Currently.
          #- runner: ubuntu-24.04-arm
          #  system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Nix-Netrc
        run: |
          cat <<EOF > "${{ runner.temp }}/nix_netrc"
          machine ${{ secrets.ATTIC_ENDPOINT }}
          login dummy
          password ${{ secrets.ATTIC_TOKEN }}
          EOF
          chmod 400 "${{ runner.temp }}/nix_netrc"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://awildleon-nixlib.cachix.org https://nix-community.cachix.org https://cache.numtide.com https://${{ secrets.ATTIC_ENDPOINT }}/${{ secrets.ATTIC_CACHE }}
            extra-trusted-public-keys = awildleon-nixlib.cachix.org-1:jDsApfkbRWepIRrxDVVFUJHQLuAgliX0WTicUnTs9rI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ${{ secrets.ATTIC_CACHE }}:BmioIhRIq/4ZvQHLcmMIWGVlcPROiGjvXpHJhp1h7pA=
            max-jobs = auto
            cores = 0
            netrc-file = ${{ runner.temp }}/nix_netrc

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0.5.0
        with:
          endpoint: https://${{ secrets.ATTIC_ENDPOINT }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-push: true

      - name: Build private cache bundle for ${{ matrix.system }}
        run: |
          # ci/cache-bundle.nix is a single derivation depending on every
          # package we want cached, from both the stable and unstable nixpkgs
          # inputs pinned in flake.lock. The package list lives in that file.
          #
          # --keep-going realizes every buildable dependency even if some
          # fail, so a package that fails to build is simply skipped rather
          # than aborting the whole run. The bundle itself may fail in that
          # case; that is fine, we only care about the realized packages.
          echo "::group::Building bundle"
          nix build --impure --keep-going --print-build-logs \
            -f ci/cache-bundle.nix bundle || true
          echo "::endgroup::"

          # Collect the outputs that actually built, for pushing.
          : > paths.txt
          while read -r p; do
            [ -z "$p" ] && continue
            if nix path-info "$p" >/dev/null 2>&1; then
              echo "$p" >> paths.txt
            else
              echo "::warning::Skipping $p (not built)"
            fi
          done < <(nix eval --impure --raw -f ci/cache-bundle.nix outPathsText)

      - name: Push built packages to Attic
        if: github.event_name != 'pull_request'
        run: |
          # Pushes the listed outputs and their runtime closure.
          # Build-time-only deps (e.g. go-modules) are not runtime
          # references and stay out of the cache.
          failed=0
          while read -r path; do
            [ -z "$path" ] && continue
            delay=5
            pushed=0
            for attempt in 1 2 3 4 5; do
              if attic push ${{ secrets.ATTIC_CACHE }} "$path"; then
                pushed=1
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                break
              fi
              echo "Push of $path failed (attempt $attempt), retrying in ${delay}s..."
              sleep "$delay"
              delay=$((delay * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::warning::Failed to push $path after 5 attempts, continuing"
              failed=$((failed + 1))
            fi
          done < paths.txt
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed path(s) failed to push"
            exit 1
          fi
