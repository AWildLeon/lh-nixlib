name: Build and push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: awildleon-nixlib
          authToken: ${{ secrets.CACHIX }}

      - name: Build allowed packages for ${{ matrix.system }}
        env:
          # Packages to build and push. One per line.
          PACKAGES: |
            traefik
        run: |
          echo "$PACKAGES" | while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "::group::Building $pkg"
            nix build --print-build-logs ".#packages.${{ matrix.system }}.$pkg"
            echo "::endgroup::"
          done
