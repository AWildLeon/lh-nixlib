name: Build and push to Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: awildleon-nixlib
          authToken: ${{ secrets.CACHIX }}
          # Don't auto-push the whole store (that would include build-time
          # deps like the go-modules vendor drv). We push only what we want
          # below.
          skipPush: true

      - name: Build allowed packages for ${{ matrix.system }}
        env:
          # Packages to build and push. One per line.
          PACKAGES: |
            traefik
            glance
        run: |
          : > paths.txt
          echo "$PACKAGES" | while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo "::group::Building $pkg"
            nix build --print-build-logs --print-out-paths \
              ".#packages.${{ matrix.system }}.$pkg" >> paths.txt
            echo "::endgroup::"
          done

      - name: Push built packages to Cachix
        if: github.event_name != 'pull_request'
        run: |
          # Pushes only the listed outputs and their runtime closure.
          # Build-time-only deps (e.g. go-modules) are not runtime
          # references and stay out of the cache.
          cachix push awildleon-nixlib < paths.txt
